name: ordo
description: "Ordo — a time-first group coordination app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.3

  # Realtime
  socket_io_client: ^2.0.3+1

  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

name: Build iOS IPA

# Manual trigger only. Go to Actions → "Build iOS IPA" → Run workflow.
# You'll be prompted for the API URL your backend will be reachable at.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL the IPA should talk to (e.g. https://api.ordo.app or http://192.168.1.5:4000). Leave empty to fall back to localhost (only works on simulator).'
        required: false
        default: ''
      flavor:
        description: 'Build flavor (unused for now, reserved for future dev/staging/prod splits).'
        required: false
        default: 'default'

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Read API URL input
        id: api
        run: |
          URL="${{ inputs.api_url }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::warning::No API URL provided — the built app will default to http://localhost:4000 and will NOT reach a backend on a real device."
          else
            echo "Building with ORDO_API_URL=$URL"
          fi

      - name: Install Dart dependencies
        run: flutter pub get

      # Pod install is needed on a fresh macOS runner for iOS builds.
      - name: Install CocoaPods deps
        run: |
          cd ios
          pod install --repo-update || pod install

      # --no-codesign produces an unsigned .app at build/ios/iphoneos/Runner.app.
      # The next step packages that .app into a sideloadable unsigned .ipa.
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ORDO_API_URL="${{ steps.api.outputs.url }}"

      # Manual IPA packaging: copy Runner.app into a Payload/ folder and zip it.
      # This is the standard unsigned-IPA layout that sideload tools expect.
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Ordo-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Ordo-unsigned.ipa

      - name: Save API URL into build metadata
        run: |
          echo "Built at:   $(date -u)" > build-info.txt
          echo "API URL:    ${{ steps.api.outputs.url || '(localhost — simulator only)' }}" >> build-info.txt
          echo "Git SHA:    ${{ github.sha }}" >> build-info.txt
          echo "Git ref:    ${{ github.ref_name }}" >> build-info.txt
          echo "Flutter:    $(flutter --version | head -1)" >> build-info.txt
          cat build-info.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ordo-iOS-${{ github.run_number }}
          path: |
            apps/mobile/Ordo-unsigned.ipa
            apps/mobile/build-info.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload xcarchive (for re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: Ordo-iOS-xcarchive-${{ github.run_number }}
          path: apps/mobile/build/ios/archive/*.xcarchive
          retention-days: 14
          if-no-files-found: warn

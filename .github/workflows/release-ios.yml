name: Release iOS

# Manual trigger only: Actions → "Release iOS" → Run workflow.
# Enter the version (e.g. 0.0.1) and, once your backend is hosted, the API URL.
# Produces an unsigned IPA and publishes it as a GitHub Release tagged vX.Y.Z.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.0.1, 0.1.3, 1.0.0). Must be unique — the workflow will fail if vX.Y.Z already exists.'
        required: true
        default: '0.0.1'
      api_url:
        description: 'Backend API URL the IPA should talk to (e.g. https://api.ordo.app). Leave empty only for simulator testing (defaults to localhost).'
        required: false
        default: ''
      notes:
        description: 'Release notes (optional, shown on the release page)'
        required: false
        default: ''

jobs:
  build:
    name: Build iOS IPA v${{ inputs.version }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dart dependencies
        run: flutter pub get

      # No manual `pod install` — Flutter generates the Podfile and runs pod
      # install automatically as part of `flutter build ios`.
      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ORDO_API_URL="${{ inputs.api_url }}"

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Ordo-${{ inputs.version }}-ios.ipa Payload
          rm -rf Payload
          ls -lh Ordo-${{ inputs.version }}-ios.ipa

      - name: Write build metadata
        run: |
          {
            echo "Ordo iOS ${{ inputs.version }}"
            echo "Built at:   $(date -u)"
            echo "API URL:    ${{ inputs.api_url || '(localhost — simulator only)' }}"
            echo "Git SHA:    ${{ github.sha }}"
            echo "Build #:    ${{ github.run_number }}"
            echo "Flutter:    $(flutter --version | head -1)"
          } > build-info.txt
          cat build-info.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ordo-${{ inputs.version }}-ios-build
          path: |
            apps/mobile/Ordo-${{ inputs.version }}-ios.ipa
            apps/mobile/build-info.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ordo-${{ inputs.version }}-ios-build
          path: release-assets

      - name: Decide pre-release flag
        id: pre
        run: |
          if [[ "${{ inputs.version }}" == 0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Ordo ${{ inputs.version }} (iOS)
          body: |
            ## Ordo ${{ inputs.version }} — iOS

            ${{ inputs.notes }}

            ---
            **Build details**
            - API URL: ${{ inputs.api_url || '(localhost — simulator only)' }}
            - Commit: ${{ github.sha }}
            - Build number: ${{ github.run_number }}

            **Install**
            Unsigned IPA — sideload with your preferred tool (AltStore, Sideloadly, etc.).
          prerelease: ${{ steps.pre.outputs.prerelease }}
          files: release-assets/*

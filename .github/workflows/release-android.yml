name: Release Android

# Manual trigger only: Actions → "Release Android" → Run workflow.
# Enter the version (e.g. 0.0.1) and, once your backend is hosted, the API URL.
# Produces a debug-signed APK (installable for testing, not Play Store ready)
# and publishes it as a GitHub Release tagged vX.Y.Z-android.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.0.1, 0.1.3, 1.0.0). Must be unique — the workflow will fail if vX.Y.Z-android already exists.'
        required: true
        default: '0.0.1'
      api_url:
        description: 'Backend API URL the APK should talk to (e.g. https://api.ordo.app). Leave empty for localhost (emulator only).'
        required: false
        default: ''
      notes:
        description: 'Release notes (optional, shown on the release page)'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APK v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dart dependencies
        run: flutter pub get

      # Release APK is debug-signed (see android/app/build.gradle.kts) — fine for
      # sideloading/testing. A real keystore is needed before Play Store upload.
      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ORDO_API_URL="${{ inputs.api_url }}"

      - name: Locate and rename APK
        run: |
          APK=$(find build -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No app-release.apk found in build/"
            exit 1
          fi
          cp "$APK" Ordo-${{ inputs.version }}-android.apk
          ls -lh Ordo-${{ inputs.version }}-android.apk

      - name: Write build metadata
        run: |
          {
            echo "Ordo Android ${{ inputs.version }}"
            echo "Built at:   $(date -u)"
            echo "API URL:    ${{ inputs.api_url || '(localhost — emulator only)' }}"
            echo "Git SHA:    ${{ github.sha }}"
            echo "Build #:    ${{ github.run_number }}"
            echo "Flutter:    $(flutter --version | head -1)"
          } > build-info.txt
          cat build-info.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ordo-${{ inputs.version }}-android-build
          path: |
            apps/mobile/Ordo-${{ inputs.version }}-android.apk
            apps/mobile/build-info.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ordo-${{ inputs.version }}-android-build
          path: release-assets

      - name: Decide pre-release flag
        id: pre
        run: |
          if [[ "${{ inputs.version }}" == 0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-android
          name: Ordo ${{ inputs.version }} (Android)
          body: |
            ## Ordo ${{ inputs.version }} — Android

            ${{ inputs.notes }}

            ---
            **Build details**
            - API URL: ${{ inputs.api_url || '(localhost — emulator only)' }}
            - Commit: ${{ github.sha }}
            - Build number: ${{ github.run_number }}

            **Install**
            Debug-signed APK — enable "Install from unknown sources" on the device, then tap to install.
          prerelease: ${{ steps.pre.outputs.prerelease }}
          files: release-assets/*
